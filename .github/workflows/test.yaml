name: Step Summary Demo

on:
  workflow_dispatch:

jobs:

  demo:

    runs-on: ubuntu-latest

    steps:

      - name: Print Log

        run: |

          echo "This goes to the logs"

      - name: Write Summary

        run: |

          echo "# CI Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** main" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Services" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- auth" >> "$GITHUB_STEP_SUMMARY"

          echo "- payment" >> "$GITHUB_STEP_SUMMARY"

          echo "- order" >> "$GITHUB_STEP_SUMMARY"
