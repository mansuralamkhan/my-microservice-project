name: Release Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: 'Type "rollback" to confirm you want to revert the selected environment to its last known-good release'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.environment }}-release-promotion
  cancel-in-progress: false

env:
  RELEASE_REGISTRY_PATH: releases
  RELEASE_SCHEMA_VERSION: "1.1"

jobs:

  resolve-rollback-target:

    name: Resolve Rollback Target

    runs-on: ubuntu-latest

    timeout-minutes: 10

    outputs:
      rollback-target: ${{ steps.resolve.outputs.rollback-target }}
      current-release: ${{ steps.resolve.outputs.current-release }}
      values-dir: ${{ steps.env-map.outputs.values-dir }}

    steps:

      - name: Validate Inputs

        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          ENVIRONMENT: ${{ inputs.environment }}

        shell: bash

        run: |
          set -euo pipefail

          if [[ "${CONFIRM_INPUT}" != "rollback" ]]; then
            echo "ERROR: Confirmation phrase did not match. Type 'rollback' to proceed."
            exit 1
          fi

          # Defense in depth: 'choice' restricts the UI dropdown, but
          # workflow_dispatch can also be triggered via the API with an
          # arbitrary string for this input. Never trust it implicitly.
          case "${ENVIRONMENT}" in
            staging|production) ;;
            *)
              echo "ERROR: Unsupported environment '${ENVIRONMENT}'."
              echo "Rollback is only supported for: staging, production."
              exit 1
              ;;
          esac

          echo "Rollback confirmed by operator for environment: ${ENVIRONMENT}"

      - name: Resolve Environment-Specific Naming

        id: env-map

        env:
          ENVIRONMENT: ${{ inputs.environment }}

        shell: bash

        run: |
          set -euo pipefail

          # NOTE (known inconsistency, not a bug): the GitOps repo names the
          # values.yaml directory "staging" for staging but "prod" for
          # production -- inherited from an earlier explicit request, not
          # accidental. environments/<env>.yaml and .promotion.<env>,
          # however, DO match `inputs.environment` directly. This mapping
          # isolates the one inconsistent case so nothing downstream has
          # to special-case it. Worth normalizing at the source (rename
          # the "prod" directory to "production") the next time someone
          # is touching the GitOps repo layout directly.

          case "${ENVIRONMENT}" in
            staging)
              VALUES_DIR="staging"
              ;;
            production)
              VALUES_DIR="prod"
              ;;
          esac

          echo "values-dir=${VALUES_DIR}" >> "${GITHUB_OUTPUT}"
          echo "Resolved values directory for ${ENVIRONMENT}: ${VALUES_DIR}"

      - name: Checkout GitOps Repository

        uses: actions/checkout@v4

        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 1
          persist-credentials: false

      - name: Install yq

        shell: bash

        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Resolve Rollback Target From Environment State

        id: resolve

        env:
          ENVIRONMENT: ${{ inputs.environment }}

        shell: bash

        run: |
          set -euo pipefail

          STATE_FILE="gitops/environments/${ENVIRONMENT}.yaml"

          echo "=========================================="
          echo "Resolving rollback target for ${ENVIRONMENT}"
          echo "=========================================="

          if [[ ! -s "${STATE_FILE}" ]]; then
            echo "ERROR: ${ENVIRONMENT} environment state file is missing."
            exit 1
          fi

          # Sole source of truth for rollback eligibility. We deliberately
          # do not consult releases/<id>/release.yaml here: that registry
          # is an audit log written by a separate job/commit and can
          # legitimately lag or fail to update even after a deployment has
          # genuinely succeeded. Gating an operational safety action on the
          # audit trail being perfectly in sync would make rollback
          # unreliable exactly when it's needed most.

          ROLLBACK_AVAILABLE=$(yq -r '.rollback.available' "${STATE_FILE}")
          ROLLBACK_TARGET=$(yq -r '.rollback.target' "${STATE_FILE}")
          CURRENT_RELEASE=$(yq -r '.currentRelease' "${STATE_FILE}")

          if [[ "${ROLLBACK_AVAILABLE}" != "true" ]]; then
            echo "ERROR: No rollback target is currently recorded for ${ENVIRONMENT}."
            echo "This can mean: no prior successful deployment exists, or a"
            echo "rollback was already consumed and not yet followed by a new"
            echo "successful promotion."
            exit 1
          fi

          if [[ -z "${ROLLBACK_TARGET}" || "${ROLLBACK_TARGET}" == "null" ]]; then
            echo "ERROR: rollback.target is empty despite rollback.available=true."
            echo "Environment state file is inconsistent; refusing to proceed."
            exit 1
          fi

          if [[ ! "${ROLLBACK_TARGET}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: rollback.target is not a valid 40-character Git SHA."
            exit 1
          fi

          if [[ "${ROLLBACK_TARGET}" == "${CURRENT_RELEASE}" ]]; then
            echo "ERROR: rollback.target is identical to the currently deployed release."
            echo "Refusing a no-op rollback."
            exit 1
          fi

          {
            echo "rollback-target=${ROLLBACK_TARGET}"
            echo "current-release=${CURRENT_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Currently deployed release : ${CURRENT_RELEASE}"
          echo "Rollback target release    : ${ROLLBACK_TARGET}"

      - name: Write Resolution Summary

        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ROLLBACK_TARGET: ${{ steps.resolve.outputs.rollback-target }}
          CURRENT_RELEASE: ${{ steps.resolve.outputs.current-release }}

        shell: bash

        run: |
          {
            echo "## ${ENVIRONMENT} Rollback: Target Resolved"
            echo ""
            echo "| Attribute | Value |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Currently Deployed Release | \`${CURRENT_RELEASE}\` |"
            echo "| Rollback Target Release | \`${ROLLBACK_TARGET}\` |"
            echo "| Source | environments/${ENVIRONMENT}.yaml (deployment state, not registry) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  validate-rollback-target:

    name: Validate Rollback Target Release

    needs:
      - resolve-rollback-target

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ROLLBACK_TARGET: ${{ needs.resolve-rollback-target.outputs.rollback-target }}

    outputs:
      image-count: ${{ steps.validate.outputs.image-count }}

    steps:

      - name: Checkout Release Registry

        uses: actions/checkout@v4

        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: release-registry
          fetch-depth: 1
          persist-credentials: false

      - name: Install yq

        shell: bash

        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate Rollback Target Is A Well-Formed Release

        id: validate

        shell: bash

        run: |
          set -euo pipefail

          RELEASE_FILE="release-registry/${RELEASE_REGISTRY_PATH}/${ROLLBACK_TARGET}/release.yaml"

          echo "=========================================="
          echo "Validating rollback target release record"
          echo "=========================================="
          echo "Environment : ${ENVIRONMENT}"
          echo "Target      : ${ROLLBACK_TARGET}"
          echo ""

          # Deliberately NOT checked here: promotion.<environment>.status.
          # Rollback answers "was this a real, valid release we can safely
          # redeploy" -- a question about the past -- not "is this eligible
          # to move forward," which is what the promotion workflow's gates
          # answer. Coupling the two caused the exact failure mode this
          # workflow exists to recover from.

          if [[ ! -s "${RELEASE_FILE}" ]]; then
            echo "ERROR: Rollback target release record does not exist."
            echo "Expected: ${RELEASE_FILE}"
            exit 1
          fi

          SCHEMA_VERSION=$(yq -r '.schemaVersion' "${RELEASE_FILE}")

          if [[ "${SCHEMA_VERSION}" != "${RELEASE_SCHEMA_VERSION}" ]]; then
            echo "ERROR: Unsupported release schema on rollback target."
            echo "Expected: ${RELEASE_SCHEMA_VERSION}"
            echo "Actual  : ${SCHEMA_VERSION}"
            exit 1
          fi

          REGISTERED_RELEASE_ID=$(yq -r '.release.id' "${RELEASE_FILE}")

          if [[ "${REGISTERED_RELEASE_ID}" != "${ROLLBACK_TARGET}" ]]; then
            echo "ERROR: Release record identity mismatch."
            exit 1
          fi

          IMAGE_COUNT=$(yq '.images | length' "${RELEASE_FILE}")

          if [[ ! "${IMAGE_COUNT}" =~ ^[0-9]+$ ]] || (( IMAGE_COUNT < 1 )); then
            echo "ERROR: Rollback target release contains no deployable images."
            exit 1
          fi

          while IFS= read -r SERVICE
          do
            REPOSITORY=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].repository' "${RELEASE_FILE}")
            TAG=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].tag' "${RELEASE_FILE}")
            DIGEST=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].digest' "${RELEASE_FILE}")

            if [[ -z "${REPOSITORY}" || "${REPOSITORY}" == "null" ]]; then
              echo "ERROR: Missing repository for ${SERVICE} on rollback target."
              exit 1
            fi

            if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
              echo "ERROR: Missing tag for ${SERVICE} on rollback target."
              exit 1
            fi

            if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "ERROR: Invalid digest for ${SERVICE} on rollback target."
              exit 1
            fi

            echo "Validated rollback metadata for ${SERVICE}."

          done < <(yq -r '.images | keys | .[]' "${RELEASE_FILE}")

          echo "image-count=${IMAGE_COUNT}" >> "${GITHUB_OUTPUT}"

          echo ""
          echo "Rollback target release is well-formed."
          echo ""
          echo "NOTE (future improvement): this only validates structure. It"
          echo "does not re-verify ECR digest presence or Cosign signatures"
          echo "the way the promotion workflow does."

  apply-rollback:

    name: Apply Rollback

    needs:
      - resolve-rollback-target
      - validate-rollback-target

    runs-on: ubuntu-latest

    timeout-minutes: 15

    environment:
      name: ${{ inputs.environment }}

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      VALUES_DIR: ${{ needs.resolve-rollback-target.outputs.values-dir }}
      ROLLBACK_TARGET: ${{ needs.resolve-rollback-target.outputs.rollback-target }}
      PREVIOUS_CURRENT_RELEASE: ${{ needs.resolve-rollback-target.outputs.current-release }}
      EXPECTED_IMAGE_COUNT: ${{ needs.validate-rollback-target.outputs.image-count }}

    outputs:
      rollback-target: ${{ steps.apply.outputs.rollback-target }}
      gitops-commit: ${{ steps.push.outputs.gitops-commit }}

    steps:

      - name: Checkout Writable GitOps Repository

        uses: actions/checkout@v4

        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout Release Registry

        uses: actions/checkout@v4

        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: release-registry
          fetch-depth: 1
          persist-credentials: false

      - name: Install yq

        shell: bash

        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Revert Services To Rollback Target Images

        id: apply

        shell: bash

        run: |
          set -euo pipefail

          RELEASE_FILE="release-registry/${RELEASE_REGISTRY_PATH}/${ROLLBACK_TARGET}/release.yaml"

          UPDATED_COUNT=0

          echo "=========================================="
          echo "Reverting ${ENVIRONMENT} to ${ROLLBACK_TARGET}"
          echo "=========================================="

          while IFS= read -r SERVICE
          do
            echo "------------------------------------------"
            echo "Service: ${SERVICE}"
            echo "------------------------------------------"

            REPOSITORY=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].repository' "${RELEASE_FILE}")
            TAG=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].tag' "${RELEASE_FILE}")
            DIGEST=$(SERVICE="${SERVICE}" yq -r '.images[strenv(SERVICE)].digest' "${RELEASE_FILE}")

            VALUES_FILE="gitops/applications/${SERVICE}/environments/${VALUES_DIR}/values.yaml"

            if [[ ! -f "${VALUES_FILE}" ]]; then
              echo "ERROR: ${ENVIRONMENT} values file does not exist for ${SERVICE}."
              echo "Expected: ${VALUES_FILE}"
              exit 1
            fi

            export REPOSITORY
            export TAG
            export DIGEST

            yq -i '
              .image.repository = strenv(REPOSITORY) |
              .image.tag = strenv(TAG) |
              .image.digest = strenv(DIGEST)
            ' "${VALUES_FILE}"

            ACTUAL_DIGEST=$(yq -r '.image.digest' "${VALUES_FILE}")

            if [[ "${ACTUAL_DIGEST}" != "${DIGEST}" ]]; then
              echo "ERROR: Digest revert failed for ${SERVICE}."
              exit 1
            fi

            UPDATED_COUNT=$((UPDATED_COUNT + 1))

            echo "${SERVICE}: reverted to ${DIGEST}"

          done < <(yq -r '.images | keys | .[]' "${RELEASE_FILE}")

          if (( UPDATED_COUNT != EXPECTED_IMAGE_COUNT )); then
            echo "ERROR: Revert count does not match expected image count."
            exit 1
          fi

          echo "rollback-target=${ROLLBACK_TARGET}" >> "${GITHUB_OUTPUT}"

          echo ""
          echo "All services reverted."

      - name: Update Environment State For Rollback

        shell: bash

        run: |
          set -euo pipefail

          STATE_FILE="gitops/environments/${ENVIRONMENT}.yaml"

          export ROLLBACK_TARGET

          # rollback.available is deliberately set to false with an empty
          # target: v1 does not support "rollback the rollback." If this
          # revert also turns out unhealthy, that is a new incident that
          # needs a human, not an automatic second hop.

          yq -i '
            .currentRelease = strenv(ROLLBACK_TARGET) |
            .desiredRelease = strenv(ROLLBACK_TARGET) |
            .status = "rolled-back" |
            .lastSuccessfulDeployment = strenv(ROLLBACK_TARGET) |
            .rollback.available = false |
            .rollback.target = ""
          ' "${STATE_FILE}"

          echo "Environment state updated for rollback."
          cat "${STATE_FILE}"

      - name: Validate GitOps Change Scope

        working-directory: gitops

        shell: bash

        run: |
          set -euo pipefail

          CHANGED_FILES=$(git diff --name-only)

          if [[ -z "${CHANGED_FILES}" ]]; then
            echo "ERROR: Rollback produced no GitOps changes."
            echo "${ENVIRONMENT} may already be at the rollback target."
            exit 1
          fi

          VALUES_REGEX="^applications/[^/]+/environments/${VALUES_DIR}/values\\.yaml\$"
          STATE_FILE_REL="environments/${ENVIRONMENT}.yaml"

          INVALID_CHANGE=false

          while IFS= read -r FILE
          do
            [[ -z "${FILE}" ]] && continue

            if [[ "${FILE}" =~ ${VALUES_REGEX} ]] || [[ "${FILE}" == "${STATE_FILE_REL}" ]]; then
                echo "Allowed change: ${FILE}"
            else
                echo "ERROR: Unauthorized GitOps change: ${FILE}"
                INVALID_CHANGE=true
            fi
          done <<< "${CHANGED_FILES}"

          if [[ "${INVALID_CHANGE}" == "true" ]]; then
            exit 1
          fi

      - name: Configure Git Identity

        working-directory: gitops

        shell: bash

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Rollback

        working-directory: gitops

        shell: bash

        run: |
          set -euo pipefail

          git add -- \
            "applications/*/environments/${VALUES_DIR}/values.yaml" \
            "environments/${ENVIRONMENT}.yaml"

          if git diff --cached --quiet; then
            echo "ERROR: No rollback changes were staged."
            exit 1
          fi

          git commit \
            -m "rollback(${ENVIRONMENT}): revert to release ${ROLLBACK_TARGET}" \
            -m "Reverted from: ${PREVIOUS_CURRENT_RELEASE}"

      - name: Push Rollback (with retry)

        id: push

        working-directory: gitops

        shell: bash

        run: |
          set -euo pipefail

          # concurrency.group already prevents this from racing THIS SAME
          # workflow's promotion for the same environment. This loop is the
          # remaining defense against any OTHER workflow (a different
          # environment's run, a manual hotfix commit) pushing to the same
          # shared main in between our pull and our push.

          MAX_ATTEMPTS=5
          ATTEMPT=1

          while (( ATTEMPT <= MAX_ATTEMPTS ))
          do
            echo "Push attempt ${ATTEMPT}/${MAX_ATTEMPTS}..."

            if git pull --rebase origin main && git push origin HEAD:main; then
              GITOPS_COMMIT=$(git rev-parse HEAD)
              echo "gitops-commit=${GITOPS_COMMIT}" >> "${GITHUB_OUTPUT}"
              echo "Rollback pushed successfully on attempt ${ATTEMPT}."
              echo "Commit: ${GITOPS_COMMIT}"
              exit 0
            fi

            echo "Push attempt ${ATTEMPT} failed (main moved concurrently)."

            if (( ATTEMPT == MAX_ATTEMPTS )); then
              echo "ERROR: Exhausted retries pushing rollback to main."
              echo "The rollback deployment change was NOT applied."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))

            sleep $(( (RANDOM % 4) + 1 ))
          done

      - name: Verify Rollback Push

        working-directory: gitops

        env:
          EXPECTED_COMMIT: ${{ steps.push.outputs.gitops-commit }}

        shell: bash

        run: |
          set -euo pipefail

          git fetch origin main

          if ! git merge-base --is-ancestor "${EXPECTED_COMMIT}" "origin/main"; then
            echo "ERROR: Rollback commit is not present on GitOps main."
            exit 1
          fi

          echo "Rollback commit confirmed on remote main."

      - name: Write Rollback Summary

        env:
          GITOPS_COMMIT: ${{ steps.push.outputs.gitops-commit }}

        shell: bash

        run: |
          {
            echo "# ${ENVIRONMENT} Rollback Applied"
            echo ""
            echo "| Attribute | Value |"
            echo "|---|---|"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Reverted From | \`${PREVIOUS_CURRENT_RELEASE}\` |"
            echo "| Reverted To | \`${ROLLBACK_TARGET}\` |"
            echo "| GitOps Commit | \`${GITOPS_COMMIT}\` |"
            echo "| Rollback Chaining | Not available until next successful promotion |"
          } >> "${GITHUB_STEP_SUMMARY}"

  record-rollback-in-registry:

    name: Record Rollback (Audit Only, Non-Blocking)

    needs:
      - resolve-rollback-target
      - apply-rollback

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # Deliberately no `environment:` gate here -- the deployment already
    # happened in apply-rollback. This job is bookkeeping, not an action,
    # and is allowed to fail without failing the workflow: a registry
    # write race here must never be interpreted as "the rollback didn't
    # happen."

    continue-on-error: true

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ROLLBACK_TARGET: ${{ needs.resolve-rollback-target.outputs.rollback-target }}
      PREVIOUS_CURRENT_RELEASE: ${{ needs.resolve-rollback-target.outputs.current-release }}

    steps:

      - name: Checkout Registry

        uses: actions/checkout@v4

        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Install yq

        shell: bash

        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.3"
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Mark Previous Release As Rolled Back

        shell: bash

        run: |
          set -euo pipefail

          RELEASE_FILE="gitops/${RELEASE_REGISTRY_PATH}/${PREVIOUS_CURRENT_RELEASE}/release.yaml"

          if [[ ! -s "${RELEASE_FILE}" ]]; then
            echo "WARNING: Previous release record not found, skipping annotation."
            exit 0
          fi

          ROLLED_BACK_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          export ROLLED_BACK_AT
          export ROLLBACK_TARGET
          export ENVIRONMENT

          # Dynamic key access via strenv(ENVIRONMENT) -- avoids building
          # yq expression strings by hand for "staging" vs "production".

          yq -i '
            .promotion[strenv(ENVIRONMENT)].status = "rolled-back" |
            .promotion[strenv(ENVIRONMENT)].rolledBackAt = strenv(ROLLED_BACK_AT) |
            .promotion[strenv(ENVIRONMENT)].rolledBackTo = strenv(ROLLBACK_TARGET)
          ' "${RELEASE_FILE}"

          echo "Annotated ${PREVIOUS_CURRENT_RELEASE} as rolled-back for ${ENVIRONMENT}."

      - name: Configure Git Identity

        working-directory: gitops

        shell: bash

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit And Push (best-effort, with retry)

        working-directory: gitops

        shell: bash

        run: |
          set -euo pipefail

          RELEASE_FILE="${RELEASE_REGISTRY_PATH}/${PREVIOUS_CURRENT_RELEASE}/release.yaml"

          git add -- "${RELEASE_FILE}" || true

          if git diff --cached --quiet; then
            echo "No registry changes to commit; skipping."
            exit 0
          fi

          git commit -m "release: mark ${PREVIOUS_CURRENT_RELEASE} rolled-back (${ENVIRONMENT}) to ${ROLLBACK_TARGET}"

          MAX_ATTEMPTS=3
          ATTEMPT=1

          while (( ATTEMPT <= MAX_ATTEMPTS ))
          do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Registry annotation pushed."
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep $(( (RANDOM % 3) + 1 ))
          done

          echo "WARNING: Could not push registry annotation after retries."
          echo "Deployment rollback already succeeded and is unaffected."
          exit 0