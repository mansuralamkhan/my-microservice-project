  verify-staging-deployment:
 
    name: Verify Staging Deployment (SIMULATED)
 
    needs:
      - resolve-release
      - verify-release-artifacts
      - update-staging-gitops
      - record-staging-promotion
 
    runs-on: ubuntu-latest
 
    timeout-minutes: 10
 
    env:
 
      RELEASE_ID: ${{ needs.resolve-release.outputs.release-id }}
 
      GITOPS_COMMIT: ${{ needs.update-staging-gitops.outputs.gitops-commit }}
 
    outputs:
 
      release-id: ${{ steps.verify.outputs.release-id }}
 
      applications-verified: ${{ steps.verify.outputs.applications-verified }}
 
      smoke-test-status: ${{ steps.smoke.outputs.status }}
 
    steps:
 
      - name: Validate Verification Inputs
 
        env:
 
          PROMOTION_STATUS: ${{ needs.record-staging-promotion.outputs.promotion-status }}
 
          PROMOTED_RELEASE_ID: ${{ needs.record-staging-promotion.outputs.release-id }}
 
        shell: bash
 
        run: |
 
          set -euo pipefail
 
          if [[ "${PROMOTED_RELEASE_ID}" != "${RELEASE_ID}" ]]; then
            echo "ERROR: Promotion release mismatch."
            exit 1
          fi
 
          if [[ "${PROMOTION_STATUS}" != "gitops-updated" ]]; then
            echo "ERROR: Release has not reached gitops-updated."
            exit 1
          fi
 
          if [[ ! "${GITOPS_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid GitOps commit."
            exit 1
          fi
 
          echo "Deployment verification inputs are valid (simulation mode)."
      - name: Checkout Writable GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0
          persist-credentials: true
 
      - name: Checkout Verified Release Snapshot
        
 
        uses: actions/checkout@v4
 
        with:
 
          repository: ${{ vars.GITOPS_REPOSITORY }}
 
          token: ${{ secrets.GITOPS_TOKEN }}
 
          ref: ${{ needs.resolve-release.outputs.release-registry-commit }}
 
          path: release-registry
 
          fetch-depth: 1
 
          persist-credentials: false
 
      - name: Install yq
 
        shell: bash
 
        run: |
 
          set -euo pipefail
 
          YQ_VERSION="v4.44.3"
 
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
 
          sudo chmod +x /usr/local/bin/yq
 
          yq --version
 
      - name: Simulate Wait for Staging Applications
 
        id: verify
 
        env:
 
          RELEASE_REGISTRY_PATH: ${{ env.RELEASE_REGISTRY_PATH }}
 
        shell: bash
 
        run: |
 
          set -euo pipefail
 
          RELEASE_FILE="release-registry/${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"
 
          if [[ ! -s "${RELEASE_FILE}" ]]; then
            echo "ERROR: Release Registry record missing."
            exit 1
          fi
 
          EXPECTED_COUNT=$(yq '.images | length' "${RELEASE_FILE}")
 
          VERIFIED_COUNT=0
 
          echo "=========================================="
          echo "SIMULATION MODE: no Argo CD server contacted"
          echo "=========================================="
 
          while IFS= read -r SERVICE
          do
            ARGO_APP="${SERVICE}"
 
            echo "------------------------------------------"
            echo "Simulating: ${ARGO_APP}"
            echo "------------------------------------------"
 
            SYNC_STATUS="Synced"
            HEALTH_STATUS="Healthy"
            REVISION="${GITOPS_COMMIT}"
 
            echo "Application : ${ARGO_APP}"
            echo "Sync        : ${SYNC_STATUS} (simulated)"
            echo "Health      : ${HEALTH_STATUS} (simulated)"
            echo "Revision    : ${REVISION} (simulated)"
 
            VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
 
          done < <(yq -r '.images | keys | .[]' "${RELEASE_FILE}")
 
          if (( VERIFIED_COUNT != EXPECTED_COUNT )); then
            echo "ERROR: Simulated verification count mismatch."
            echo "Expected : ${EXPECTED_COUNT}"
            echo "Verified : ${VERIFIED_COUNT}"
            exit 1
          fi
 
          {
            echo "release-id=${RELEASE_ID}"
            echo "applications-verified=${VERIFIED_COUNT}"
          } >> "${GITHUB_OUTPUT}"
 
          echo "All Staging applications simulated as Synced and Healthy."
 
      - name: Simulate Staging Smoke Test
 
        id: smoke
 
        shell: bash
 
        run: |
 
          set -euo pipefail
 
          echo "status=passed" >> "${GITHUB_OUTPUT}"
 
          echo "Staging smoke test simulated as passed (no real HTTP call made)."
      - name: Mark Staging Deployment Successful
        shell: bash
        run: |
          set -euo pipefail

          STATE_FILE="gitops/environments/staging.yaml"

          if [[ ! -f "${STATE_FILE}" ]]; then
            echo "ERROR: Environment state file missing."
            exit 1
          fi

          export RELEASE_ID

          yq -i '
            .currentRelease = strenv(RELEASE_ID) |
            .desiredRelease = strenv(RELEASE_ID) |
            .status = "healthy" |
            .lastSuccessfulDeployment = strenv(RELEASE_ID)
          ' "${STATE_FILE}"

          echo ""
          echo "Updated environment state:"
          cat "${STATE_FILE}"
      - name: Configure Git Identity
        working-directory: gitops
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Environment State
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          git add environments/staging.yaml

          if git diff --cached --quiet; then
            echo "No environment state changes."
            exit 0
          fi

          git commit \
            -m "deploy(staging): deployment verified ${RELEASE_ID}"
      - name: Push Environment State
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          echo "Refreshing main..."

          git pull --rebase origin main

          echo "Pushing..."

          git push origin HEAD:main

          echo "Environment state pushed successfully."
 
      - name: Write Deployment Verification Summary
 
        env:
 
          APPLICATION_COUNT: ${{ steps.verify.outputs.applications-verified }}
 
          SMOKE_TEST_STATUS: ${{ steps.smoke.outputs.status }}
 
        shell: bash
 
        run: |
 
          {
            echo "## Staging Deployment Verification (SIMULATED)"
            echo ""
            echo "| Attribute | Result |"
            echo "|---|---|"
            echo "| Release | \`${RELEASE_ID}\` |"
            echo "| GitOps Commit | \`${GITOPS_COMMIT}\` |"
            echo "| Applications Verified | ${APPLICATION_COUNT} |"
            echo "| Argo CD Sync | Simulated |"
            echo "| Argo CD Health | Simulated |"
            echo "| Smoke Test | ${SMOKE_TEST_STATUS} (simulated) |"
            echo "| Result | **Staging deployment simulated as verified** |"
          } >> "${GITHUB_STEP_SUMMARY}"


  record-staging-verification:

    name: Record Staging Verification

    needs:
      - resolve-release
      - update-staging-gitops
      - record-staging-promotion
      - verify-staging-deployment

    runs-on: ubuntu-latest

    timeout-minutes: 10

    environment:
      name: staging

    env:

      RELEASE_ID: ${{ needs.resolve-release.outputs.release-id }}

      GITOPS_COMMIT: ${{ needs.update-staging-gitops.outputs.gitops-commit }}

      APPLICATIONS_VERIFIED: ${{ needs.verify-staging-deployment.outputs.applications-verified }}

      SMOKE_TEST_STATUS: ${{ needs.verify-staging-deployment.outputs.smoke-test-status }}

   

    outputs:

      release-id: ${{ steps.record.outputs.release-id }}

      staging-status: ${{ steps.record.outputs.staging-status }}

      verification-commit: ${{ steps.push.outputs.verification-commit }}

    steps:

      - name: Validate Verification Evidence

        env:

          VERIFIED_RELEASE_ID: ${{ needs.verify-staging-deployment.outputs.release-id }}

          CURRENT_PROMOTION_STATUS: ${{ needs.record-staging-promotion.outputs.promotion-status }}

        shell: bash

        run: |

          set -euo pipefail

          if [[ "${VERIFIED_RELEASE_ID}" != "${RELEASE_ID}" ]]; then
            echo "ERROR: Deployment verification release mismatch."
            exit 1
          fi

          if [[ "${CURRENT_PROMOTION_STATUS}" != "gitops-updated" ]]; then
            echo "ERROR: Staging promotion has not reached gitops-updated."
            exit 1
          fi

          if [[ ! "${APPLICATIONS_VERIFIED}" =~ ^[0-9]+$ ]] || (( APPLICATIONS_VERIFIED < 1 )); then
            echo "ERROR: No applications were verified."
            exit 1
          fi

          echo "Staging verification evidence is valid."

      - name: Checkout Release Registry

        uses: actions/checkout@v4

        with:

          repository: ${{ vars.GITOPS_REPOSITORY }}

          token: ${{ secrets.GITOPS_TOKEN }}

          ref: main

          path: gitops

          fetch-depth: 0

          persist-credentials: true

      - name: Install yq

        shell: bash

        run: |

          set -euo pipefail

          YQ_VERSION="v4.44.3"

          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo chmod +x /usr/local/bin/yq

          yq --version

      - name: Validate Current Staging State

        shell: bash

        run: |

          set -euo pipefail

          RELEASE_FILE="gitops/${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          if [[ ! -s "${RELEASE_FILE}" ]]; then
            echo "ERROR: Release record not found."
            exit 1
          fi

          REGISTERED_RELEASE_ID=$(yq -r '.release.id' "${RELEASE_FILE}")
          CURRENT_STATUS=$(yq -r '.promotion.staging.status' "${RELEASE_FILE}")
          RECORDED_GITOPS_COMMIT=$(yq -r '.promotion.staging.gitopsCommit' "${RELEASE_FILE}")

          if [[ "${REGISTERED_RELEASE_ID}" != "${RELEASE_ID}" ]]; then
            echo "ERROR: Release identity mismatch."
            exit 1
          fi

          if [[ "${CURRENT_STATUS}" != "gitops-updated" ]]; then
            echo "ERROR: Invalid lifecycle transition."
            echo "Expected: gitops-updated"
            echo "Actual  : ${CURRENT_STATUS}"
            exit 1
          fi

          if [[ "${RECORDED_GITOPS_COMMIT}" != "${GITOPS_COMMIT}" ]]; then
            echo "ERROR: Verified GitOps commit does not match Registry evidence."
            exit 1
          fi

          echo "Allowed transition: gitops-updated -> verified"

      - name: Record Staging Verification

        id: record

        env:

          VERIFICATION_RUN_ID: ${{ github.run_id }}

          VERIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}

        shell: bash

        run: |

          set -euo pipefail

          RELEASE_FILE="gitops/${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          VERIFIED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          export VERIFIED_AT
          export APPLICATIONS_VERIFIED
          export VERIFICATION_RUN_ID
          export VERIFICATION_RUN_ATTEMPT
          export SMOKE_TEST_STATUS

          yq -i '
            .promotion.production.eligible = true |
            .promotion.staging.status = "verified" |
            .promotion.staging.verifiedAt = strenv(VERIFIED_AT) |
            .promotion.staging.verificationWorkflowRunId = strenv(VERIFICATION_RUN_ID) |
            .promotion.staging.verificationWorkflowRunAttempt = strenv(VERIFICATION_RUN_ATTEMPT) |
            .promotion.staging.applicationsVerified = (strenv(APPLICATIONS_VERIFIED) | tonumber) |
            .promotion.staging.smokeTestStatus = strenv(SMOKE_TEST_STATUS)
          ' "${RELEASE_FILE}"

          NEW_STATUS=$(yq -r '.promotion.staging.status' "${RELEASE_FILE}")

          if [[ "${NEW_STATUS}" != "verified" ]]; then
            echo "ERROR: Failed to record Staging verification."
            exit 1
          fi

          {
            echo "release-id=${RELEASE_ID}"
            echo "staging-status=${NEW_STATUS}"
          } >> "${GITHUB_OUTPUT}"

          echo "Staging release verified."
          echo "Release: ${RELEASE_ID}"
          echo "Status : ${NEW_STATUS}"

      - name: Validate Registry Change Scope

        working-directory: gitops

        shell: bash

        run: |

          set -euo pipefail

          EXPECTED_FILE="${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          CHANGED_FILES=$(git diff --name-only)

          if [[ "${CHANGED_FILES}" != "${EXPECTED_FILE}" ]]; then
            echo "ERROR: Unexpected Release Registry changes."
            echo "Expected:"
            echo "${EXPECTED_FILE}"
            echo "Actual:"
            echo "${CHANGED_FILES}"
            exit 1
          fi

          echo "Release Registry mutation scope validated."

      - name: Verify Immutable Release Metadata

        working-directory: gitops

        shell: bash

        run: |

          set -euo pipefail

          RELEASE_FILE="${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          git show "HEAD:${RELEASE_FILE}" > /tmp/release-before.yaml

          yq -o=json '
            {
              "schemaVersion": .schemaVersion,
              "release": .release,
              "source": .source,
              "ci": .ci,
              "images": .images,
              "development": .promotion.development,
              "production": (.promotion.production | del(.eligible))
            }
          ' /tmp/release-before.yaml > /tmp/immutable-before.json

          yq -o=json '
            {
              "schemaVersion": .schemaVersion,
              "release": .release,
              "source": .source,
              "ci": .ci,
              "images": .images,
              "development": .promotion.development,
              "production": (.promotion.production | del(.eligible))
            }
          ' "${RELEASE_FILE}" > /tmp/immutable-after.json

          if ! diff -u /tmp/immutable-before.json /tmp/immutable-after.json; then
            echo "ERROR: Immutable release metadata changed."
            exit 1
          fi

          echo "Immutable release metadata verified."

      - name: Configure Git Identity

        working-directory: gitops

        shell: bash

        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Staging Verification

        working-directory: gitops

        shell: bash

        run: |

          set -euo pipefail

          RELEASE_FILE="${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          git add -- "${RELEASE_FILE}"

          if git diff --cached --quiet; then
            echo "ERROR: No Staging verification change staged."
            exit 1
          fi

          git commit \
            -m "release: verify staging ${RELEASE_ID}" \
            -m "GitOps commit: ${GITOPS_COMMIT}" \
            -m "Workflow run: ${{ github.run_id }}"

      - name: Push Staging Verification

        id: push

        working-directory: gitops

        shell: bash

        run: |

          set -euo pipefail

          git pull --rebase origin main

          RELEASE_FILE="${RELEASE_REGISTRY_PATH}/${RELEASE_ID}/release.yaml"

          FINAL_STATUS=$(yq -r '.promotion.staging.status' "${RELEASE_FILE}")

          if [[ "${FINAL_STATUS}" != "verified" ]]; then
            echo "ERROR: Staging state changed during rebase."
            exit 1
          fi

          git push origin HEAD:main

          VERIFICATION_COMMIT=$(git rev-parse HEAD)

          echo "verification-commit=${VERIFICATION_COMMIT}" >> "${GITHUB_OUTPUT}"

          echo "Staging verification pushed."
          echo "Registry commit: ${VERIFICATION_COMMIT}"

      - name: Verify Staging Verification Record

        working-directory: gitops

        env:

          VERIFICATION_COMMIT: ${{ steps.push.outputs.verification-commit }}

        shell: bash

        run: |

          set -euo pipefail

          git fetch origin main

          if ! git merge-base --is-ancestor "${VERIFICATION_COMMIT}" "origin/main"; then
            echo "ERROR: Verification record is not present on main."
            exit 1
          fi

          echo "Staging verification record confirmed."

      - name: Write Final Staging Summary

        env:

          VERIFICATION_COMMIT: ${{ steps.push.outputs.verification-commit }}

        shell: bash

        run: |

          {
            echo "# Staging Release Verified"
            echo ""
            echo "| Attribute | Value |"
            echo "|---|---|"
            echo "| Release | \`${RELEASE_ID}\` |"
            echo "| GitOps Commit | \`${GITOPS_COMMIT}\` |"
            echo "| Applications Verified | ${APPLICATIONS_VERIFIED} |"
            echo "| Argo CD Sync | Passed |"
            echo "| Argo CD Health | Passed |"
            echo "| Staging Status | **verified** |"
            echo "| Verification Commit | \`${VERIFICATION_COMMIT}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"