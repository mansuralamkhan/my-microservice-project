name: Deploy to Development

on:

  # Automatic deployment after CI succeeds
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed

  # Manual deployment
  workflow_dispatch:

    inputs:

      release_sha:
        description: "Release SHA to deploy (optional)"
        required: false
        type: string

      simulate_result:
        description: "Deployment result"

        required: true

        default: success

        type: choice

        options:
          - success
          - partial_failure
          - failure

permissions:

  contents: write

  actions: read

  id-token: write

concurrency:

  group: deploy-development

  cancel-in-progress: false

env:

  ENVIRONMENT: development

  GITOPS_REPOSITORY: mansuralamkhan/gitops-infrastructure-microservice

  RELEASES_PATH: releases

  ENVIRONMENT_FILE: environments/development.yaml

  HISTORY_PATH: deployment-history/development


jobs:
  deploy:
    name: Deploy Development
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: bash

    env:
      GITOPS_REPOSITORY: mansuralamkhan/gitops-infrastructure-microservice
      ENVIRONMENT_FILE: environments/development.yaml

    steps:
      ####################################################################
      # Checkout Application Repository
      ####################################################################
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ####################################################################
      # Resolve Release SHA
      ####################################################################
      - name: Resolve Release
        id: release
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RELEASE_SHA="${{ inputs.release_sha }}"

            if [[ -z "${RELEASE_SHA}" ]]; then
              echo "Release SHA is required."
              exit 1
            fi

            echo "CI_RUN_ID=" >> "$GITHUB_OUTPUT"

          else

            RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
            CI_RUN_ID="${{ github.event.workflow_run.id }}"

            echo "CI_RUN_ID=${CI_RUN_ID}" >> "$GITHUB_OUTPUT"

          fi

          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

          echo "Deploying Release: ${RELEASE_SHA}"

      ####################################################################
      # Download Deployment Contract
      ####################################################################
      - name: Download Deployment Contract
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
          run-id: ${{ steps.release.outputs.CI_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: deployment-manifest

      ####################################################################
      # Validate Deployment Contract
      ####################################################################
      - name: Validate Deployment Contract
        run: |
          set -euo pipefail

          test -f deployment-manifest/deployment-manifest.json
        

          echo "Deployment contract verified."

      ####################################################################
      # Checkout GitOps Repository
      ####################################################################
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 1

      ####################################################################
      # Validate Environment File
      ####################################################################
      - name: Validate Environment File
        run: |
          set -euo pipefail

          FILE="gitops/${ENVIRONMENT_FILE}"

          if [[ ! -f "$FILE" ]]; then
            echo "Environment file not found: $FILE"
            exit 1
          fi

      ####################################################################
      # Read Current Environment State
      ####################################################################
      - name: Read Environment State
        id: environment
        run: |
          set -euo pipefail

          FILE="gitops/${ENVIRONMENT_FILE}"

          CURRENT_RELEASE=$(yq '.currentRelease' "$FILE")

          echo "Current Release: ${CURRENT_RELEASE}"

          echo "current=${CURRENT_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "rollback=${CURRENT_RELEASE}" >> "$GITHUB_OUTPUT"

      ####################################################################
      # Update Desired Release
      ####################################################################
      - name: Set Desired Release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.RELEASE_SHA }}
        run: |
          set -euo pipefail

          FILE="gitops/${ENVIRONMENT_FILE}"

          yq -i '
            .desiredRelease = strenv(RELEASE_SHA) |
            .status = "deploying"
          ' "$FILE"

          echo "Desired Release Updated"

          cat "$FILE"


            ####################################################################
        # Validate Deployment Manifest
        ####################################################################
      ####################################################################
# Validate Deployment Manifest
####################################################################
      - name: Validate Deployment Manifest
        run: |
            set -euo pipefail

            FILE="deployment-manifest/deployment-manifest.json"

            jq empty "$FILE"

            jq -e '.schemaVersion' "$FILE" >/dev/null
            jq -e '.releaseId' "$FILE" >/dev/null
            jq -e '.images' "$FILE" >/dev/null

            COUNT=$(jq '.images | length' "$FILE")

            if [[ "$COUNT" -eq 0 ]]; then
            echo "Deployment manifest contains no images."
            exit 1
            fi

            echo "Release: $(jq -r '.releaseId' "$FILE")"
            echo "Found $COUNT image(s)."

        ####################################################################
        # Validate GitOps Structure
        ####################################################################
      - name: Validate GitOps Structure
        run: |
            set -euo pipefail

            FILE="deployment-manifest/deployment-manifest.json"

            jq -c '.images[]' "$FILE" | while read SERVICE; do

            NAME=$(echo "$SERVICE" | jq -r '.service')

            VALUES_FILE="gitops/applications/${NAME}/environments/dev/values.yaml"

            if [[ ! -f "$VALUES_FILE" ]]; then
                echo "Missing GitOps configuration:"
                echo "$VALUES_FILE"
                exit 1
            fi

            echo "Validated ${NAME}"

            done

        ####################################################################
        # Update GitOps Manifests
        ####################################################################
      - name: Update GitOps Manifests
        run: |
            set -euo pipefail

            FILE="deployment-manifest/deployment-manifest.json"

            jq -c '.images[]' "$FILE" | while read SERVICE; do

            NAME=$(echo "$SERVICE" | jq -r '.service')
            REPOSITORY=$(echo "$SERVICE" | jq -r '.repository')
            TAG=$(echo "$SERVICE" | jq -r '.tag')
            DIGEST=$(echo "$SERVICE" | jq -r '.digest')

            VALUES_FILE="gitops/applications/${NAME}/environments/dev/values.yaml"

            echo "Updating ${NAME}"

            yq -i "
                .image.repository = \"${REPOSITORY}\" |
                .image.tag = \"${TAG}\" |
                .image.digest = \"${DIGEST}\"
            " "$VALUES_FILE"

            done

        ####################################################################
        # Create Release History
        ####################################################################
      ####################################################################
# Create Release History
####################################################################
      - name: Create Release History
        env:
            RELEASE_SHA: ${{ steps.release.outputs.RELEASE_SHA }}
        run: |
            set -euo pipefail
            Unexpected value 'RELEASE=$(jq -r '.releaseId' deployment-manifest/deployment-manifest.json)'

            RELEASE_DIR="gitops/${RELEASES_PATH}/${RELEASE_SHA}"

            mkdir -p "${RELEASE_DIR}"

            cp deployment-manifest/deployment-manifest.json \
            "${RELEASE_DIR}/deployment-manifest.json"

            cat > "${RELEASE_DIR}/release.yaml" <<EOF
            release: ${RELEASE_SHA}
            environment: ${ENVIRONMENT}
            createdBy: github-actions
            workflowRun: ${GITHUB_RUN_ID}
            createdAt: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
            EOF

            echo "Release history created at ${RELEASE_DIR}"

        ####################################################################
        # Commit GitOps Changes
        ####################################################################
      - name: Commit GitOps Changes
        run: |
            set -euo pipefail

            cd gitops

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add .

            if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
            fi

            git commit -m "Deploy release ${{ steps.release.outputs.RELEASE_SHA }} to ${ENVIRONMENT}"

            git push origin HEAD