      cpu: "500m"
      memory: "1Gi"
      
  - name: transaction-service
    dependencies: [account-service]
    deployment-order: 2
    deployment-strategy: rolling
    resource-limits:
      cpu: "1"
      memory: "2Gi"
      
  - name: user-service
    dependencies: [account-service]
    deployment-order: 2
    deployment-strategy: rolling
    resource-limits:
      cpu: "500m"
      memory: "1Gi"


# .github/environments/development.yaml
name: development
deployment-branch-policy:
  protected-branches: false
  custom-branch-policies: true
environment-variables:
  CONTAINER_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com/dev
  EKS_CLUSTER: dev-cluster
  DOMAIN_SUFFIX: .dev.example.com
protection-rules: []

# .github/environments/production.yaml
name: production
deployment-branch-policy:
  protected-branches: true
  custom-branch-policies: false
environment-variables:
  CONTAINER_REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com/prod
  EKS_CLUSTER: prod-cluster
  DOMAIN_SUFFIX: .example.com
protection-rules:
  required_reviewers:
    teams:
      - production-approvers
  wait_timer:
    minutes: 30
  deployment_branch_policy:
    protected_branches: true


# .github/pipeline-config.yaml
version: 1
sla:
  build-time: 600  # 10 minutes
  deployment-time: 1200  # 20 minutes
  total-time: 1800  # 30 minutes
  
notifications:
  slack:
    channel-id: "C12345678"
    success-emoji: "✅"
    failure-emoji: "❌"
    warning-emoji: "⚠️"
    
  email:
    recipients:
      - devops@example.com
      - engineering-leads@example.com
      
security:
  container-scanning:
    severity-threshold: "HIGH"
    ignore-unfixed: true
    fail-on-threshold: true
    
  dependency-scanning:
    cvss-threshold: 7.0
    fail-on-threshold: true
    
  secrets-scanning:
    enabled: true
    pattern: "github_token|aws_secret|private_key"
    
deployment:
  strategies:
    development:
      type: recreate
      max-unavailable: 100%
      
    staging:
      type: rolling
      max-unavailable: 0
      max-surge: 1
      
    production:
      type: blue-green
      verification-timeout: 300
      auto-rollback: true



