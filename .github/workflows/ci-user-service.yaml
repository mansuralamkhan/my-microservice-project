name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: write
  attestations: write
  id-token: write

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Services
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            echo "Pull Request detected."
            echo "Target branch: ${BASE_REF}"

            git fetch origin "${BASE_REF}"

            CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            echo "Push detected."
            echo "Before SHA: ${BEFORE_SHA}"
            echo "Current SHA: ${CURRENT_SHA}"

            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              echo "New branch detected."

              if git rev-parse "${CURRENT_SHA}^" >/dev/null 2>&1; then
                CHANGED_FILES=$(git diff --name-only "${CURRENT_SHA}^" "${CURRENT_SHA}")
              else
                CHANGED_FILES=$(git ls-tree -r --name-only "${CURRENT_SHA}")
              fi
            else
              CHANGED_FILES=$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
            fi

          else
            echo "Manual workflow detected."
            echo "All services will be validated."

            CHANGED_FILES=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n')
          fi

          echo ""
          echo "========================================"
          echo "Changed Files"
          echo "========================================"
          echo "${CHANGED_FILES}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICES=$(echo "${CHANGED_FILES}" | awk -F'/' '{print $2}' | sort -u)
          else
            SERVICES=$(echo "${CHANGED_FILES}" | grep '^services/' | awk -F'/' '{print $2}' | sort -u || true)
          fi

          if echo "${CHANGED_FILES}" | grep -Eq '^(pom\.xml|shared/|libs/|docker/base/)'; then
            echo ""
            echo "Shared component changed."
            echo "All services will be rebuilt."

            SERVICES=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | awk -F'/' '{print $2}' | sort -u)
          fi

          echo ""
          echo "========================================"
          echo "Affected Services"
          echo "========================================"
          echo "${SERVICES}"

          if [[ -z "${SERVICES}" ]]; then
            echo "No microservices affected."
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'has-changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(
            echo "${SERVICES}" \
            | jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map({
                    service: .,
                    dockerfile: ("services/" + . + "/Dockerfile")
                  })
              '
          )

          echo ""
          echo "Generated Matrix:"
          echo "${MATRIX}"

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"


  validate-services:
    name: Validate ${{ matrix.service }}
    needs:
      - detect-changes
    if: |
      github.event_name != 'push' &&
      needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      service-name: ${{ matrix.service }}
      dockerfile: ${{ matrix.dockerfile }}
      java-version: "21"
      aws-region: "ap-south-1"
      ecr-repository: ${{ matrix.service }}
      push-image: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  build-services:
    name: Build Release ${{ matrix.service }}
    needs:
      - detect-changes
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'dev' &&
      needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      service-name: ${{ matrix.service }}
      dockerfile: ${{ matrix.dockerfile }}
      java-version: "21"
      aws-region: "us-east-1"
      ecr-repository: ${{ matrix.service }}
      push-image: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  create-deployment-manifest:
    name: Create Deployment Manifest
    needs:
      - detect-changes
      - build-services
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'dev' &&
      needs.detect-changes.outputs.has-changes == 'true' &&
      needs.build-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Service Metadata
        uses: actions/download-artifact@v4
        with:
          pattern: deployment-metadata-*
          path: deployment-metadata
          merge-multiple: true

      - name: Verify Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment metadata files:"
          find deployment-metadata -type f -name "*.json" -print

          METADATA_COUNT=$(find deployment-metadata -type f -name "*.json" | wc -l)
          echo "Metadata count: ${METADATA_COUNT}"

          if [[ "${METADATA_COUNT}" -eq 0 ]]; then
            echo "ERROR: No deployment metadata generated."
            exit 1
          fi

      - name: Generate Deployment Manifest
        env:
          RELEASE_ID: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          jq -s '.' deployment-metadata/*.json > images.json
          jq 'sort_by(.service)' images.json > sorted-images.json

          jq -n \
            --arg schemaVersion "1.1" \
            --arg releaseId "${RELEASE_ID}" \
            --arg repository "${SOURCE_REPOSITORY}" \
            --arg branch "${SOURCE_BRANCH}" \
            --arg commit "${COMMIT_SHA}" \
            --arg workflow "${WORKFLOW_NAME}" \
            --arg runId "${RUN_ID}" \
            --arg runAttempt "${RUN_ATTEMPT}" \
            --slurpfile images sorted-images.json \
            '{
              schemaVersion: $schemaVersion,
              releaseId: $releaseId,
              source: {
                repository: $repository,
                branch: $branch,
                commit: $commit
              },
              ci: {
                workflow: $workflow,
                runId: $runId,
                runAttempt: $runAttempt
              },
              images: $images[0]
            }' \
            > deployment-manifest.json

          echo "Deployment Manifest:"
          jq '.' deployment-manifest.json

      - name: Validate Deployment Manifest
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .schemaVersion == "1.1"
            and (.releaseId | type == "string" and length == 40)
            and (.source.repository | type == "string" and length > 0)
            and (.source.branch == "dev")
            and (.source.commit == .releaseId)
            and (.ci.workflow | type == "string" and length > 0)
            and (.ci.runId | type == "string" and length > 0)
            and (.ci.runAttempt | type == "string" and length > 0)
            and (.images | type == "array" and length > 0)
            and (
              all(
                .images[];
                (.service | type == "string" and length > 0)
                and (.repository | type == "string" and length > 0)
                and (.tag | type == "string" and length > 0)
                and (.digest | type == "string" and startswith("sha256:"))
              )
            )
          ' deployment-manifest.json

          echo "Deployment manifest validation successful."

      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: deployment-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Write CI Summary
        shell: bash
        run: |
          {
            echo "## Deployment Manifest"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo ""
            echo "**CI Run:** \`${{ github.run_id }}\`"
            echo ""
            echo "### Images"
            echo ""
            jq -r '.images[] | "- **\(.service)** → `\(.repository)@\(.digest)`"' deployment-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"


  register-release:
    name: Register Release
    needs:
      - create-deployment-manifest
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'dev' &&
      needs.create-deployment-manifest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Deployment Manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
          path: deployment

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0

      - name: Create Release Record
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="deployment/deployment-manifest.json"

          RELEASE_ID=$(jq -r '.releaseId' "${MANIFEST}")
          SOURCE_REPOSITORY=$(jq -r '.source.repository' "${MANIFEST}")
          SOURCE_BRANCH=$(jq -r '.source.branch' "${MANIFEST}")
          SOURCE_COMMIT=$(jq -r '.source.commit' "${MANIFEST}")

          CI_WORKFLOW=$(jq -r '.ci.workflow' "${MANIFEST}")
          CI_RUN_ID=$(jq -r '.ci.runId' "${MANIFEST}")
          CI_RUN_ATTEMPT=$(jq -r '.ci.runAttempt' "${MANIFEST}")

          RELEASE_DIR="gitops/releases/${RELEASE_ID}"
          RELEASE_FILE="${RELEASE_DIR}/release.yaml"

          mkdir -p "${RELEASE_DIR}"

          if [[ -f "${RELEASE_FILE}" ]]; then
            echo "ERROR: Release record already exists."
            echo "Release: ${RELEASE_ID}"
            exit 1
          fi

          if [[ "${RELEASE_ID}" != "${SOURCE_COMMIT}" ]]; then
            echo "ERROR: Release ID does not match source commit."
            exit 1
          fi

          if [[ "${SOURCE_BRANCH}" != "dev" ]]; then
            echo "ERROR: Releases may only originate from dev."
            exit 1
          fi

          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > "${RELEASE_FILE}" <<EOF
          schemaVersion: "1.1"

          release:
            id: "${RELEASE_ID}"
            createdAt: "${CREATED_AT}"
            status: "created"

          source:
            repository: "${SOURCE_REPOSITORY}"
            branch: "${SOURCE_BRANCH}"
            commit: "${SOURCE_COMMIT}"

          ci:
            workflow: "${CI_WORKFLOW}"
            runId: "${CI_RUN_ID}"
            runAttempt: "${CI_RUN_ATTEMPT}"
            status: "passed"

          promotion:
            development:
              status: "pending"

            staging:
              status: "pending"

            production:
              eligible: false
              status: "pending"

          images:
          EOF

          while IFS= read -r item; do
            SERVICE=$(echo "${item}" | jq -r '.service')
            REPOSITORY=$(echo "${item}" | jq -r '.repository')
            TAG=$(echo "${item}" | jq -r '.tag')
            DIGEST=$(echo "${item}" | jq -r '.digest')

            cat >> "${RELEASE_FILE}" <<EOF

            ${SERVICE}:
              repository: "${REPOSITORY}"
              tag: "${TAG}"
              digest: "${DIGEST}"
          EOF
          done < <(jq -c '.images[]' "${MANIFEST}")

          echo ""
          echo "Created release record:"
          echo ""
          cat "${RELEASE_FILE}"

      - name: Write CI Summary
        shell: bash
        run: |
          {
            echo "## Release Created"
            echo ""
            echo "**Release ID:** \`${{ github.sha }}\`"
            echo ""
            echo "**Source Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Source Branch:** \`${{ github.ref_name }}\`"
            echo ""
            echo "**Repository:** \`${{ github.repository }}\`"
            echo ""
            echo "**CI Run:** \`${{ github.run_id }}\`"
            echo ""
            echo "**CI Attempt:** \`${{ github.run_attempt }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit Release Record
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID=$(jq -r '.releaseId' ../deployment/deployment-manifest.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "releases/${RELEASE_ID}/release.yaml"
          git commit -m "release: register ${RELEASE_ID}"
          git pull --rebase origin main
          git push origin HEAD:main


  ci-status:
    name: CI Status Gate
    needs:
      - detect-changes
      - validate-services
      - build-services
      - create-deployment-manifest
      - register-release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Required Jobs
        shell: bash
        run: |
          set -euo pipefail

          declare -A RESULTS=(
            ["detect-changes"]="${{ needs.detect-changes.result }}"
            ["validate-services"]="${{ needs.validate-services.result }}"
            ["build-services"]="${{ needs.build-services.result }}"
            ["create-deployment-manifest"]="${{ needs.create-deployment-manifest.result }}"
            ["register-release"]="${{ needs.register-release.result }}"
          )

          FAILED=false

          for job in "${!RESULTS[@]}"; do
            result="${RESULTS[$job]}"
            echo "${job}: ${result}"

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "  -> Required job failed or was cancelled."
              FAILED=true
            fi
          done

          if [[ "${FAILED}" == "true" ]]; then
            echo ""
            echo "CI Status Gate: FAILED"
            exit 1
          fi

          echo ""
          echo "CI Status Gate: PASSED"
